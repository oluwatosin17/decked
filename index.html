<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- PWA: Apple Touch Icons (iOS requires 180x180) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#05050a" />

    <!-- PWA: iOS standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Decked" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA: Splash screens for iOS (prevents white flash on launch) -->
    <meta name="apple-touch-startup-image" content="/pwa-512x512.png" />

    <meta name="description" content="Play free party and conversation games online with Decked. Pick a deck, pass the phone, or invite friends to join from their own devices—no download or account needed." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://www.usedecked.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Decked" />
    <meta property="og:title" content="Decked — Free Online Party & Conversation Games" />
    <meta property="og:description" content="Play free party and conversation games online. No download, no account, and no complicated setup." />
    <meta property="og:url" content="https://www.usedecked.com/" />
    <meta property="og:image" content="https://www.usedecked.com/brand/decked-social-avatar.png" />
    <meta property="og:image:alt" content="Decked party game logo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Decked — Free Online Party & Conversation Games" />
    <meta name="twitter:description" content="Play free party and conversation games online. No download, no account, and no complicated setup." />
    <meta name="twitter:image" content="https://www.usedecked.com/brand/decked-social-avatar.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.usedecked.com/#website",
            "name": "Decked",
            "url": "https://www.usedecked.com/",
            "description": "Free online party and conversation games for friends, couples, families, and groups.",
            "publisher": { "@id": "https://www.usedecked.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://www.usedecked.com/#organization",
            "name": "Decked",
            "url": "https://www.usedecked.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.usedecked.com/brand/decked-mark.png"
            },
            "email": "hello@usedecked.com"
          }
        ]
      }
    </script>
    <title>Decked — Free Online Party &amp; Conversation Games</title>

    <!-- Google Fonts — preconnect + swap for fast loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Spicy+Rice&family=Staatliches&family=Inter:wght@400;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Anton+SC&family=Galindo&family=Spicy+Rice&family=Staatliches&family=Slackey&family=Single+Day&family=Luckiest+Guy&family=Stick&family=Gasoek+One&family=Freckle+Face&family=Fredericka+the+Great&family=Inter:wght@400;700&family=Inter+Tight:wght@300&display=swap" rel="stylesheet" />
    <!-- Satoshi (Fontshare) -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
