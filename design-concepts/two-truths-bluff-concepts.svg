<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <radialGradient id="space" cx="50%" cy="25%" r="90%"><stop offset="0" stop-color="#17102d"/><stop offset="1" stop-color="#05050a"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".38"/></filter>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#ff3950" flood-opacity=".65"/></filter>
    <pattern id="dots" width="110" height="86" patternUnits="userSpaceOnUse"><circle cx="18" cy="22" r="2.5" fill="#fff" opacity=".55"/><circle cx="74" cy="62" r="1.5" fill="#c7b8ff" opacity=".5"/></pattern>
    <style>
      .anton{font-family:Impact,'Arial Narrow',sans-serif;font-weight:900;letter-spacing:.5px}
      .inter{font-family:Inter,Arial,sans-serif}
      .label{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700;fill:#aaa4b8;letter-spacing:2px}
      .title{font-family:Impact,'Arial Narrow',sans-serif;font-weight:900;fill:white}
    </style>
  </defs>
  <rect width="1800" height="1260" fill="url(#space)"/><rect width="1800" height="1260" fill="url(#dots)"/>
  <text x="90" y="82" class="title" font-size="48">TWO TRUTHS &amp; A BLUFF — CARD DIRECTIONS</text>
  <text x="90" y="122" class="inter" fill="#9c96aa" font-size="20">Each direction includes the Browse Games cover and its matching in-game voting state.</text>

  <!-- OPTION 1 -->
  <g transform="translate(70 178)">
    <text x="0" y="0" class="label">01 · THREE-CARD STACK</text>
    <rect x="0" y="28" width="500" height="470" rx="34" fill="#f4d84b" filter="url(#shadow)"/>
    <!-- cross sticker from icon 02 -->
    <g transform="translate(74 70) scale(.70)" fill="#151022" opacity=".10"><path d="M250.8 493.2c-67.6 0-122.1-54.8-122.1-122.4V129.2C128.7 61.6 183.2 6.8 250.8 6.8s122.1 54.8 122.1 122.4v241.5c0 67.7-54.5 122.5-122.1 122.5z"/><path d="M371.6 371.7H128.4C60.8 371.7 6 316.4 6 248.8s54.8-122.9 122.4-122.9h243.2c67.6 0 122.4 55.3 122.4 122.9s-54.8 122.9-122.4 122.9z"/></g>
    <g transform="translate(94 184) rotate(-7 110 110)"><rect width="220" height="220" rx="22" fill="#f7f2e9" stroke="#151022" stroke-width="7"/><text x="110" y="126" text-anchor="middle" class="anton" font-size="42" fill="#151022">TRUTH</text></g>
    <g transform="translate(190 166) rotate(6 110 110)"><rect width="220" height="220" rx="22" fill="#a997ff" stroke="#151022" stroke-width="7"/><text x="110" y="126" text-anchor="middle" class="anton" font-size="42" fill="#151022">TRUTH</text></g>
    <g transform="translate(142 214)"><rect width="220" height="220" rx="22" fill="#ff3446" stroke="#151022" stroke-width="7"/><text x="110" y="143" text-anchor="middle" class="anton" font-size="86" fill="#fff">?</text></g>
    <text x="250" y="92" text-anchor="middle" class="anton" font-size="42" fill="#151022">TWO TRUTHS</text><text x="250" y="137" text-anchor="middle" class="anton" font-size="34" fill="#151022">&amp; A BLUFF</text>
    <text x="0" y="544" class="label">IN GAME</text>
    <rect x="0" y="572" width="500" height="520" rx="34" fill="#0b0911" stroke="#302b39" stroke-width="2" filter="url(#shadow)"/>
    <text x="250" y="630" text-anchor="middle" class="anton" font-size="32" fill="#fff">WHICH ONE IS THE BLUFF?</text>
    <text x="250" y="661" text-anchor="middle" class="inter" font-size="17" fill="#918b9c">Tosin has submitted three statements</text>
    <g class="inter" font-size="18" fill="#151022">
      <rect x="36" y="700" width="428" height="88" rx="16" fill="#f7f2e9"/><circle cx="72" cy="744" r="19" fill="#151022"/><text x="72" y="751" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="108" y="750">I once missed a flight on purpose.</text>
      <rect x="36" y="806" width="428" height="88" rx="16" fill="#a997ff"/><circle cx="72" cy="850" r="19" fill="#151022"/><text x="72" y="857" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="108" y="856">I can play three instruments.</text>
      <rect x="36" y="912" width="428" height="88" rx="16" fill="#17131f" stroke="#ff3446" stroke-width="3"/><circle cx="72" cy="956" r="19" fill="#ff3446"/><text x="72" y="963" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="108" y="962" fill="#fff">I met a famous actor backstage.</text>
    </g>
    <rect x="36" y="1022" width="428" height="48" rx="24" fill="#ff3446"/><text x="250" y="1054" text-anchor="middle" class="anton" font-size="20" fill="#fff">LOCK IN MY VOTE</text>
  </g>

  <!-- OPTION 2 -->
  <g transform="translate(650 178)">
    <text x="0" y="0" class="label">02 · THE HIDDEN MARK</text>
    <rect x="0" y="28" width="500" height="470" rx="34" fill="#7555d9" filter="url(#shadow)"/>
    <!-- repeated icon 01 flower -->
    <g fill="#f3efe6" opacity=".16"><path transform="translate(20 48) scale(1.3)" d="m84.06 50c15.65-30.6-3.5-49.69-34.06-34.06-30.6-15.65-49.69 3.5-34.06 34.06-15.65 30.6 3.51 49.69 34.06 34.06 30.6 15.65 49.69-3.51 34.06-34.06z"/><path transform="translate(350 330) scale(1.2)" d="m84.06 50c15.65-30.6-3.5-49.69-34.06-34.06-30.6-15.65-49.69 3.5-34.06 34.06-15.65 30.6 3.51 49.69 34.06 34.06 30.6 15.65 49.69-3.51 34.06-34.06z"/></g>
    <rect x="82" y="72" width="336" height="326" rx="20" fill="#efe9ff" stroke="#151022" stroke-width="8"/>
    <text x="250" y="145" text-anchor="middle" class="anton" font-size="38" fill="#151022">TWO TRUTHS</text><text x="250" y="187" text-anchor="middle" class="anton" font-size="30" fill="#151022">&amp; A BLUFF</text>
    <g transform="translate(145 222)"><circle cx="30" cy="30" r="30" fill="#55cc92"/><path d="m18 30 8 8 17-19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="105" cy="30" r="30" fill="#55cc92"/><path d="m93 30 8 8 17-19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="180" cy="30" r="30" fill="#ff3446"/><text x="180" y="43" text-anchor="middle" class="anton" font-size="40" fill="#fff">?</text></g>
    <rect x="132" y="304" width="236" height="54" rx="8" fill="#151022"/><text x="250" y="340" text-anchor="middle" class="anton" font-size="20" fill="#f4d84b">CAN YOU SPOT IT?</text>
    <text x="0" y="544" class="label">IN GAME · REVEAL</text>
    <rect x="0" y="572" width="500" height="520" rx="34" fill="#0b0911" stroke="#302b39" stroke-width="2" filter="url(#shadow)"/>
    <text x="250" y="630" text-anchor="middle" class="anton" font-size="34" fill="#fff">THE REVEAL</text><text x="250" y="663" text-anchor="middle" class="inter" font-size="17" fill="#918b9c">2 of 3 players spotted the bluff</text>
    <g class="inter" font-size="17">
      <rect x="36" y="700" width="428" height="84" rx="18" fill="#17131f" stroke="#55cc92" stroke-width="2"/><circle cx="76" cy="742" r="22" fill="#55cc92"/><path d="m65 742 8 8 16-18" fill="none" stroke="#fff" stroke-width="6"/><text x="112" y="748" fill="#fff">I once missed a flight on purpose.</text>
      <rect x="36" y="802" width="428" height="84" rx="18" fill="#17131f" stroke="#55cc92" stroke-width="2"/><circle cx="76" cy="844" r="22" fill="#55cc92"/><path d="m65 844 8 8 16-18" fill="none" stroke="#fff" stroke-width="6"/><text x="112" y="850" fill="#fff">I can play three instruments.</text>
      <rect x="36" y="904" width="428" height="96" rx="18" fill="#ff3446" filter="url(#glow)"/><text x="62" y="941" class="anton" font-size="17" fill="#fff">BLUFF</text><text x="62" y="972" fill="#fff">I met a famous actor backstage.</text>
    </g>
    <text x="250" y="1045" text-anchor="middle" class="inter" font-size="15" fill="#aaa4b8">Mo and Jade guessed correctly</text>
  </g>

  <!-- OPTION 3 -->
  <g transform="translate(1230 178)">
    <text x="0" y="0" class="label">03 · LIE DETECTOR</text>
    <rect x="0" y="28" width="500" height="470" rx="34" fill="#101317" filter="url(#shadow)"/>
    <rect x="38" y="66" width="424" height="354" rx="24" fill="#d8ffdf" stroke="#2ef091" stroke-width="3"/>
    <text x="250" y="137" text-anchor="middle" class="anton" font-size="37" fill="#071b11">TWO TRUTHS</text><text x="250" y="178" text-anchor="middle" class="anton" font-size="29" fill="#071b11">&amp; A BLUFF</text>
    <path d="M72 245h55l18-42 29 86 27-66 25 40h47l20-31 25 54 26-73 24 32h60" fill="none" stroke="#132d20" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="145" cy="330" r="27" fill="#2ef091"/><circle cx="250" cy="330" r="27" fill="#2ef091"/><circle cx="355" cy="330" r="27" fill="#ff3446"/><text x="355" y="341" text-anchor="middle" class="anton" font-size="32" fill="#fff">?</text>
    <text x="250" y="386" text-anchor="middle" class="inter" font-size="16" font-weight="700" fill="#345744" letter-spacing="2">READ THE SIGNALS</text>
    <text x="0" y="544" class="label">IN GAME · QUESTION PERIOD</text>
    <rect x="0" y="572" width="500" height="520" rx="34" fill="#0b0911" stroke="#302b39" stroke-width="2" filter="url(#shadow)"/>
    <text x="250" y="628" text-anchor="middle" class="anton" font-size="30" fill="#fff">QUESTION TOSIN</text><text x="250" y="660" text-anchor="middle" class="inter" font-size="16" fill="#918b9c">Ask questions before everyone votes</text>
    <g transform="translate(34 698)" class="inter">
      <rect width="432" height="278" rx="24" fill="#12191a" stroke="#2ef091" stroke-width="2"/>
      <path d="M26 72h44l13-30 19 61 21-48 17 29h37l16-24 18 39 17-51 18 24h48" fill="none" stroke="#2ef091" stroke-width="4" opacity=".8"/>
      <text x="28" y="140" fill="#fff" font-size="17">1  I once missed a flight on purpose.</text><text x="28" y="184" fill="#fff" font-size="17">2  I can play three instruments.</text><text x="28" y="228" fill="#fff" font-size="17">3  I met a famous actor backstage.</text>
    </g>
    <rect x="35" y="998" width="208" height="52" rx="26" fill="none" stroke="#fff" stroke-width="2"/><text x="139" y="1031" text-anchor="middle" class="anton" font-size="17" fill="#fff">ASKING QUESTIONS</text>
    <rect x="257" y="998" width="208" height="52" rx="26" fill="#ff3446"/><text x="361" y="1031" text-anchor="middle" class="anton" font-size="18" fill="#fff">START VOTING</text>
  </g>
</svg>
